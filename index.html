<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ficha de Treino</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&display=swap">
<style>
/* Layout: caderno de treino em coluna única. Abas em barra segmentada fixa no topo, cartões macios por exercício,
   botão Salvar flutuante. Cores das anilhas olímpicas como sinal: verde (subir), azul (manter), amarelo (reduzir), vermelho (alerta). */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eef1f5; --line:#e1e5eb; --fg:#141821; --muted:#5f6878;
  --accent:#3552c9; --accent-soft:#eceffb; --on-accent:#ffffff;
  --ok:#14804a; --ok-soft:#e3f4ea; --warn:#a15c00; --warn-soft:#fdf1dc; --plate-red:#c8283c;
  --shadow:0 1px 2px rgba(20,24,33,.04),0 6px 18px rgba(20,24,33,.06);
  --display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1015; --surface:#161a21; --surface-2:#1d222b; --line:#272d38; --fg:#eef1f6; --muted:#9aa3b2;
  --accent:#8aa4ff; --accent-soft:#1b2440; --on-accent:#0d1015;
  --ok:#5cd08f; --ok-soft:#142b1f; --warn:#f0b75a; --warn-soft:#33260f; --plate-red:#ff6b7d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1015; --surface:#161a21; --surface-2:#1d222b; --line:#272d38; --fg:#eef1f6; --muted:#9aa3b2;
  --accent:#8aa4ff; --accent-soft:#1b2440; --on-accent:#0d1015;
  --ok:#5cd08f; --ok-soft:#142b1f; --warn:#f0b75a; --warn-soft:#33260f; --plate-red:#ff6b7d;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 96px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 2px;text-align:center;font-size:11px;color:var(--muted);min-width:0}
.wd b{display:block;font-family:var(--display);font-size:15px;color:var(--fg);letter-spacing:.03em}
.wd .tag{display:block;margin-top:2px;font-size:10px;line-height:1.2}
.wd.lift .tag{color:var(--accent);font-weight:600}
.wd.today{outline:2px solid var(--accent);outline-offset:-2px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding-block:6px}
.tab{position:relative;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 2px 6px;cursor:pointer;min-width:0;text-align:center}
.tab b{display:block;font:700 16px/1 var(--display);letter-spacing:.03em}
.tab small{display:block;font:500 10px/1.15 var(--body);color:var(--muted);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .dot{position:absolute;top:4px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tab[aria-selected="true"] small{color:var(--on-accent);opacity:.85}
.tab[aria-selected="true"] .dot{background:var(--on-accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.dayhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.note{font-size:13px;color:var(--muted);margin:0}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.banner{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ctop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.ctop > div{min-width:0}
.kind{font:600 11px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kind.c{color:var(--accent)}
.exname{font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.02em;line-height:1.1;margin-top:3px}
.rx{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:2px}
select.swap{font:500 12px var(--body);color:var(--accent);background:var(--accent-soft);border:0;border-radius:6px;padding:6px 8px;max-width:150px}
.bi{color:var(--warn)}
.kind.cd{color:var(--ok)}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 8px}
.cgrid label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:4px}
.cgrid input{width:100%;min-width:0;box-sizing:border-box;font:500 16px var(--mono);padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.banner.dl{background:var(--accent-soft);color:var(--fg)}
.an h3,.hx h3{font-family:var(--display);font-size:20px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.an p,.an li{margin:0;font-size:14px}
.an ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.an .when{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.spark{width:100%;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
.tbl td{padding:4px 0;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{color:var(--muted);width:56px}
.exnote{margin:0;font-size:13px;color:var(--muted)}
.kind.bj{color:var(--accent)}
.kind.pw{color:var(--warn)}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.segb{font:600 14px var(--body);padding:11px 4px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);cursor:pointer}
.segb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ckrow{display:flex;gap:8px;align-items:flex-end}
.ckgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ckgrid label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:4px;min-width:0}
.ckgrid input{width:100%;box-sizing:border-box;font:500 16px var(--mono);padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.ckrow label{flex:1;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:flex;flex-direction:column;gap:4px;min-width:0}
.ckrow input{width:100%;box-sizing:border-box;font:500 16px var(--mono);padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.ckbtn{font:600 14px var(--body);background:var(--accent);color:var(--on-accent);border:0;border-radius:8px;padding:11px 16px;cursor:pointer}
.last{font-family:var(--mono);font-size:12.5px;color:var(--fg);background:var(--bg);border-radius:7px;padding:7px 9px;font-variant-numeric:tabular-nums}
.last b{font-family:var(--body);font-weight:600;color:var(--muted)}
.rd{border-radius:8px;padding:8px 10px;font-size:13px;background:var(--accent-soft)}
.rd.bad{background:var(--warn-soft);color:var(--warn)}
.rd.good{background:var(--ok-soft);color:var(--ok)}
.dec{display:flex;flex-direction:column;gap:3px;font-size:12px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.dec .bad{color:var(--warn)} .dec .good{color:var(--ok)} .dec .ok{color:var(--fg)} .dec .n{color:var(--muted)}
.dech{font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.calc{display:flex;flex-direction:column;gap:6px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 2px;cursor:pointer;font:600 12px var(--body);text-align:center;min-width:0}
.chip b{display:block;font:600 14px var(--mono);font-variant-numeric:tabular-nums;margin-top:1px}
.chip.rec{border-color:var(--ok)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.calcf{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.zgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.zgrid label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px;text-align:center;letter-spacing:.04em}
.zgrid input{width:100%;min-width:0;box-sizing:border-box;font:500 15px var(--mono);padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.zh{font:600 11px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.askrow{display:flex;gap:8px;flex-wrap:wrap}
.askrow .ckbtn{flex:1}
.ghost{font:600 14px var(--body);background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:8px;padding:10px 14px;cursor:pointer}
.askout{display:flex;flex-direction:column;gap:10px}
.askout table{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.askout th{font-size:11px;text-align:left;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:4px 6px 4px 0;border-bottom:1px solid var(--line)}
.askout td{padding:5px 6px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.askout td.tr{font-family:var(--mono);white-space:nowrap}
.askout ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.askout .al{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
.rpet{border-collapse:collapse;margin-top:6px;font-size:13px;width:100%}
.rpet td{padding:4px 6px;border-top:1px solid var(--line);vertical-align:top}
.rpet td:first-child{font-family:var(--mono);white-space:nowrap;color:var(--accent);width:72px}
.rpebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.rpebox summary{font-size:14px}
.card.big{padding:16px}
.card.big .exname{font-size:26px}
.card.small{padding:12px 14px;gap:8px}
.card.small .exname{font-size:19px}
.kind.c{display:inline-block;background:var(--accent);color:var(--on-accent);padding:3px 6px;border-radius:4px}
.ctitle{min-width:0}
.swapbtn{position:relative;flex:none;display:inline-flex;align-items:center;gap:4px;font:600 12px var(--body);color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:7px 9px;white-space:nowrap;cursor:pointer;overflow:hidden}
.swapsel{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.how{background:none;border:0;padding:0}
.how summary{font-size:13px;color:var(--accent);font-weight:600}
.how p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.okb{width:44px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--muted);font:700 18px var(--body);cursor:pointer}
.okb[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.sets input.dn{border-color:var(--ok)}
.donesum{display:none}
.card.done{border-color:var(--ok)}
.card.done .exname::after{content:" ✓";color:var(--ok)}
.card.done:not(.open) .body{display:none}
.card.done:not(.open) .donesum{display:block;font-family:var(--mono);font-size:12px;color:var(--ok)}
.card.done .ctop{cursor:pointer}
.body{display:flex;flex-direction:column;gap:inherit}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.prog .bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.opts{padding:9px 12px}
.opts summary{font-size:14px;color:var(--fg)}
.opts .ob{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.link{background:none;border:0;color:var(--accent);font:600 14px var(--body);cursor:pointer;padding:6px 0}
.rest{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.rest-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px;pointer-events:auto;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.rest-lbl{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rest-t{font:700 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.rest button{background:transparent;color:inherit;border:1px solid currentColor;border-radius:7px;padding:7px 9px;font:600 13px var(--body);cursor:pointer;opacity:.85}
.rest.over .rest-in{background:var(--ok);color:var(--on-accent)}
@media (prefers-reduced-motion:no-preference){.rest.over .rest-in{animation:pulse 1s ease-in-out 3}}
@keyframes pulse{50%{transform:scale(1.03)}}
.ramp{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--bg);border:1px dashed var(--line);border-radius:7px;padding:7px 9px;font-variant-numeric:tabular-nums}
.ramp b{color:var(--fg);font-weight:500}
.sug{border-radius:8px;padding:8px 10px;font-size:13px;background:var(--accent-soft);color:var(--fg)}
.sug.up{background:var(--ok-soft)} .sug.up strong{color:var(--ok)}
.sug.stall{background:var(--warn-soft)} .sug.stall strong{color:var(--warn)}
.sets{display:grid;grid-template-columns:auto 1.2fr 1fr 1fr 44px;gap:6px 8px;align-items:center}
.sets .h{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sets .n{font-family:var(--mono);font-size:13px;color:var(--muted);width:24px}
.sets input{width:100%;min-width:0;box-sizing:border-box;font:500 16px var(--mono);font-variant-numeric:tabular-nums;padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.hist{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:2px;font-variant-numeric:tabular-nums}
.save{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.save .in{max-width:640px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{flex:1;font:600 16px var(--body);background:var(--accent);color:var(--on-accent);border:0;border-radius:9px;padding:13px;cursor:pointer}
.status{font-size:12px;color:var(--muted);min-width:0;flex:0 1 40%}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.col{display:flex;flex-direction:column;gap:12px}
.q h3{font-family:var(--display);font-size:19px;margin:0;text-transform:uppercase;letter-spacing:.03em}
.ql{font-size:13px;color:var(--muted);margin:2px 0 0;display:flex;flex-direction:column;gap:4px}
.ql input{width:100%;box-sizing:border-box;font:500 16px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.ckgrid input:not([inputmode]){font-family:var(--body)}
.qchips{display:flex;flex-wrap:wrap;gap:6px}
.qc{font:500 14px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--fg);cursor:pointer}
.qc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.plist{margin:0;padding-left:18px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.nav.scroll{display:flex;overflow-x:auto;scrollbar-width:none}
.nav.scroll .tab{flex:0 0 64px}
.al{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 10px;font-size:13px}
#status{min-height:1.2em}
.gd{padding:10px 12px}
.gd summary{font-size:15px}
.gb{display:flex;flex-direction:column;gap:8px;margin-top:8px;font-size:14px}
.gb p{margin:0}
.gb ol,.gb ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.gt{width:100%;border-collapse:collapse;font-size:13px}
.gt td{padding:7px 6px 7px 0;border-top:1px solid var(--line);vertical-align:top}
.gt td.tr{font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
.gt td.good{color:var(--ok);font-weight:600}.gt td.bad{color:var(--warn);font-weight:600}
.banner.bl{border:0;text-align:left;font:600 14px var(--body);cursor:pointer;background:var(--accent-soft);color:var(--fg);width:100%}
.refs{font-size:13px}
.plain{font-size:14px;line-height:1.4;margin-top:4px}
.tag{display:inline-block;font:700 10.5px var(--body);letter-spacing:.06em;padding:2px 6px;border-radius:4px;vertical-align:1px}
.t-up{background:var(--ok);color:var(--on-accent)}.t-keep{background:var(--accent);color:var(--on-accent)}.t-down{background:var(--warn);color:var(--on-accent)}.t-new{background:var(--fg);color:var(--bg)}
.tour{border:2px solid var(--accent)}
.tl{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px}

.how3{background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.how3 p{margin:0}.how3 ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px}
.qm{border:1px solid var(--line);background:var(--bg);color:var(--accent);border-radius:50%;width:18px;height:18px;padding:0;font:600 11px var(--body);cursor:pointer;margin-left:2px}

.esprow{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:6px}
.esphead{display:flex;gap:8px;align-items:center;justify-content:space-between}
.espmod{flex:1;font:500 15px var(--body);padding:9px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg);min-width:0}



/* ---------- camada visual ---------- */
body{font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{gap:16px;padding-block:18px 120px}
header{display:flex;align-items:center;gap:12px}
header::before{content:"";flex:none;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle,var(--bg) 0 5px,var(--accent) 6px 11px,var(--fg) 12px 17px)}
header{flex-wrap:wrap}
header > *{min-width:0}
header #status{flex-basis:100%;margin-top:-4px}
h1{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1}
#status{font-size:13px;color:var(--muted)}
.nav{gap:6px;padding-block:8px;top:env(safe-area-inset-top,0px);background:linear-gradient(var(--bg) 80%,transparent)}
.tab{border:0;background:var(--surface);box-shadow:var(--shadow);border-radius:14px;padding:9px 4px 8px;transition:transform .15s,background .15s}
.tab b{font:800 19px/1 var(--display);letter-spacing:.02em}
.tab small{font:500 10.5px/1.2 var(--body)}
.tab .dot{top:6px;right:7px;width:7px;height:7px;background:var(--plate-red)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tab[aria-selected="true"] small{color:var(--bg);opacity:.75}
.tab[aria-selected="true"] .dot{background:var(--plate-red)}
.nav.scroll .tab{flex:0 0 78px}
.dayhead h2{font:800 34px/1 var(--display);letter-spacing:.01em}
.card{border:0;border-radius:20px;padding:18px;box-shadow:var(--shadow);gap:12px}
.card.big .exname{font-size:30px}
.card.small{padding:16px}
.card.small .exname{font-size:23px}
.exname{font:800 25px/1.05 var(--display);letter-spacing:.01em;text-wrap:balance}
.kind{font:700 11px/1 var(--body);letter-spacing:.1em;color:var(--muted)}
.kind.c{background:var(--accent);color:var(--on-accent);padding:4px 8px;border-radius:999px}
.plain{font-size:15px;color:var(--fg)}
.plain b{font-weight:700}
.rx{font:500 12px var(--mono);color:var(--muted);letter-spacing:.01em}
.swapbtn{border-radius:999px;padding:8px 12px;background:var(--surface-2);color:var(--fg);font:600 12.5px var(--body)}
.sug{border-radius:14px;padding:12px 14px;font-size:14px;background:var(--accent-soft)}
.sug.up{background:var(--ok-soft)} .sug.stall{background:var(--warn-soft)}
.sug strong{font-weight:700}
.tag{border-radius:999px;padding:3px 9px;font:800 10.5px var(--body);letter-spacing:.08em}
.t-up{background:var(--ok)}.t-keep{background:var(--accent)}.t-down{background:var(--warn)}.t-new{background:var(--fg);color:var(--bg)}
.last{background:var(--surface-2);border-radius:12px;padding:9px 12px;font:500 12.5px var(--mono)}
.sets{gap:8px 8px;grid-template-columns:22px 1.25fr 1fr 1fr 46px}
.sets .h{font:700 10.5px var(--body);letter-spacing:.1em}
.sets .n{font:800 18px var(--display);color:var(--muted)}
.sets input{border:1.5px solid transparent;background:var(--surface-2);border-radius:12px;padding:11px 10px;font:500 17px var(--mono);text-align:center;transition:border-color .15s,background .15s}
.sets input:focus{border-color:var(--accent);background:var(--surface);outline:none}
.sets input::placeholder{color:var(--muted);opacity:.65}
.sets input.dn{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.okb{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font:800 18px var(--body);transition:background .15s,transform .1s}
.okb:active{transform:scale(.92)}
.okb[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.qm{width:18px;height:18px;border:0;background:var(--accent-soft);color:var(--accent)}
.rd{border-radius:14px;padding:11px 13px;font-size:14px}
.card.done{box-shadow:0 0 0 2px var(--ok),var(--shadow)}
.card.done:not(.open) .donesum{font:500 13px var(--mono)}
.prog{font-size:13px;font-weight:600}
.prog .bar{height:8px;border-radius:999px;background:var(--surface-2)}
.prog .bar i{border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--ok))}
details{border:0;border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
summary{font-weight:700}
.opts{padding:12px 16px}
.how{box-shadow:none;padding:0}
.toggle{border:0;background:var(--surface-2);border-radius:12px}
.banner{border-radius:14px;padding:12px 14px;font-size:14px}
.banner.dl{background:var(--accent-soft)}
.banner.bl{background:var(--fg);color:var(--bg);border-radius:14px}
.ckbtn,.btn{border-radius:14px;font-weight:700;letter-spacing:.01em}
.ghost{border-radius:14px;border:1.5px solid var(--line);color:var(--fg);font-weight:600}
.link{color:var(--accent);font-weight:700}
.save{background:transparent;border:0;padding-top:0}
.save .in{background:var(--surface);border-radius:20px;padding:8px;box-shadow:0 10px 30px rgba(20,24,33,.18)}
.btn{background:var(--fg);color:var(--bg);padding:15px;font-size:16px}
.rest{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.rest-in{border-radius:999px;padding:10px 12px 10px 20px;background:var(--fg);color:var(--bg)}
.rest-t{font:500 28px/1 var(--mono)}
.rest button{border-radius:999px}
.q h3{font:800 22px/1.05 var(--display);letter-spacing:.01em}
.qc{border:1.5px solid var(--line);background:var(--surface);font:600 14px var(--body);padding:10px 14px}
.qc[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.ql input,.ckgrid input,.ckrow input,.cgrid input,.zgrid input,.espmod{border:1.5px solid transparent;background:var(--surface-2);border-radius:12px}
.ql input:focus,.ckgrid input:focus,.cgrid input:focus,.zgrid input:focus,.espmod:focus{border-color:var(--accent);outline:none}
.ckgrid label,.cgrid label{font:700 10.5px var(--body);letter-spacing:.1em}
.how3{background:var(--surface-2);border-radius:16px;padding:14px 16px}
.tour{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.esprow{border:0;background:var(--surface-2);border-radius:16px;padding:12px}
.esprow .qc{background:var(--surface)}
.esprow .qc[aria-pressed="true"]{background:var(--fg)}
.kpi{border:0;border-radius:18px;box-shadow:var(--shadow);padding:14px}
.kpi b{font:800 30px/1 var(--display)}
.gd{box-shadow:none;background:var(--surface-2);border-radius:14px}
.gt td.good{color:var(--ok)}
.spark path{stroke-width:2.5}
.al{border-radius:12px}

/* ================= Ficha de Treino: plano gerado pelo questionário ================= */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>{ if(n===""||n==null||!isFinite(n)) return ""; return String(Math.round(Number(n)*100)/100).replace(".",","); };
const num=v=>{ const t=String(v??"").trim().replace(",","."); return t===""?NaN:Number(t); };
function todayISO(){ const n=new Date(); return new Date(n.getTime()-n.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function weekStart(iso){ const d=new Date(iso+"T12:00:00"); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return d.toISOString().slice(0,10); }
const dstr=iso=>{ const [y,m,d]=iso.split("-"); return `${d}/${m}`; };

const TIME_EX={30:4,45:5,60:6,75:7,90:8};
const beginner=pf=>pf.exp==="nunca"||pf.exp==="ate6";
function weeksIn(pf){ if(!pf||!pf.inicio) return 0; return Math.floor((new Date(todayISO()+"T12:00:00")-new Date(pf.inicio+"T12:00:00"))/(7*864e5)); }
const tecnica=pf=>beginner(pf)&&weeksIn(pf)<2;

function pickOpts(def,pf){
  const loc=pf.local||"completa"; let opts=(def.o[loc]||def.o.completa).slice();
  (pf.dores||[]).forEach(d=>{ if(def[d]) opts=def[d].concat(opts.filter(x=>!def[d].includes(x))); });
  const ban=(pf.evitar||"").toLowerCase().split(/[,;\n]/).map(s=>s.trim()).filter(s=>s.length>=4);
  const ok=opts.filter(o=>!ban.some(b=>o.toLowerCase().includes(b)));
  return (ok.length?ok:opts).filter((x,i,a)=>a.indexOf(x)===i);
}
function splitFor(pf,lift){ const k=pf.divisao&&pf.divisao!=="auto"&&SPLITS[pf.divisao]?pf.divisao:autoSplit(lift,pf); return k; }
function liftDays(pf){ const want=(pf.dias||[]).length||3; let lift=Math.min(want,6); if(beginner(pf)&&lift>4&&(!pf.divisao||pf.divisao==="auto")) lift=4; return Math.max(2,lift); }

/* volume semanal: séries por músculo, contando 1 para o músculo principal e frações para os auxiliares (contagem fracionada, como em Pelland 2025) */
function weeklyVolume(days){ const v={}, f={}; MUSCLES.forEach(m=>{ v[m]=0; f[m]=0; });
  days.forEach(d=>{ const hit=new Set(); d.ex.forEach(e=>{ v[e.m]+=e.sets; hit.add(e.m); Object.entries(LIB[e.p].sec||{}).forEach(([m,w])=>{ v[m]+=e.sets*w; }); }); hit.forEach(m=>f[m]++); });
  return {v,f}; }

function buildPlan(pf){
  const want=(pf.dias||[]).length||3, lift=liftDays(pf), sk=splitFor(pf,lift), sp=SPLITS[sk];
  const G=GOALS[pf.objetivo]||GOALS.misto, G2=pf.secundario?GOALS[pf.secundario]:null;
  const maxEx=TIME_EX[pf.tempo]||6, prio=new Set(pf.prioridades||[]);
  const days=[...Array(lift).keys()].map(di=>{ const tm=T[sp.t[di%sp.t.length]];
    let slots=tm.s.map((s,si)=>({...s,si,def:LIB[s.p]}));
    const comp=slots.filter(x=>x.def.k==="C"), acc=slots.filter(x=>x.def.k!=="C");
    acc.sort((a,b)=>(prio.has(b.def.m)?1:0)-(prio.has(a.def.m)?1:0)||a.si-b.si);
    slots=comp.slice(0,Math.max(2,maxEx-2)).concat(acc).concat(comp.slice(Math.max(2,maxEx-2))).slice(0,maxEx);
    const key="d"+(di+1);
    const ex=slots.map((x,i)=>{ const P=x.def.k==="C"?G.C:G.A; const opts=pickOpts(x.def,pf);
      const rot=x.o%opts.length; const ord=opts.slice(rot).concat(opts.slice(0,rot));
      let sets=P.sets+(prio.has(x.def.m)?1:0); if(maxEx<=4&&x.def.k!=="C") sets=Math.min(sets,2); sets=Math.min(sets,4);
      let rpe=P.rpe.slice(0,1); while(rpe.length<sets) rpe.push(P.rpe[Math.min(rpe.length,P.rpe.length-1)]);
      if(beginner(pf)) rpe=rpe.map(r=>Math.min(r,8)); if(tecnica(pf)) rpe=rpe.map((r,i)=>i?7:6.5);
      return {id:key+"x"+i,p:x.p,k:x.def.k,m:x.def.m,opts:ord,sets,lo:P.lo,hi:P.hi,rpe,rest:P.rest,low:!!x.def.low,how:x.def.how||""}; });
    return {key,n:tm.n,ex};
  });
  const dows=(pf.dias||[1,3,5]).map(Number).sort((a,b)=>((a+6)%7)-((b+6)%7));
  const arr=arrangeDays(days,dows,pf); const ordered=arr.order.map(i=>days[i]);
  ordered.forEach((d,i)=>{ d.dow=dows[i]!=null?[dows[i]]:[]; }); days.sort((a,b)=>ordered.indexOf(a)-ordered.indexOf(b));
  /* esportes que cansam as pernas ou o tronco tiram 1 série dos acessórios daquela região (mínimo 2) */
  const esp=pf.esportes||[]; let legW=0, upW=0, aerN=0;
  esp.forEach(x=>{ const S=SPORTS[x.mod]||SPORTS.Outro, k=INT[x.int]||0.6, n=(x.dias||[]).length; legW+=S.leg*k*n; upW+=S.up*k*n; if(S.aer&&k>=0.6) aerN+=n; });
  const cutReg=(set)=>days.forEach(d=>d.ex.forEach(e=>{ if(e.k!=="C"&&set.has(e.p)&&e.sets>2){ e.sets--; e.rpe=e.rpe.slice(0,e.sets); } }));
  const espNotes=[];
  if(legW>=1.8){ cutReg(new Set(["quad","ham","glute","calves"])); espNotes.push("Suas atividades já cansam bastante as pernas: os acessórios de perna têm 1 série a menos."); }
  if(upW>=1.8){ cutReg(new Set(["biceps","triceps"])); espNotes.push("Suas atividades já exigem muito do tronco e da pegada: bíceps e tríceps têm 1 série a menos."); }
  days.forEach(d=>{ const t=d.dow.length?sportsOn(pf,d.dow[0]):[]; const r=regionOf(d); const ld=d.dow.length?sportLoad(pf,d.dow[0]):{leg:0}; const nd=d.dow.length?sportLoad(pf,(d.dow[0]+1)%7):{leg:0};
    d.sport=t.map(x=>`${x.mod} (${x.int})`); d.warn=r.L>0.5&&ld.leg>=0.6?"Perna no mesmo dia de uma atividade forte de pernas: faça a musculação antes e não vá até o limite.":r.L>0.5&&nd.leg>=0.6?"Amanhã tem atividade forte de pernas: pare 1–2 reps antes do RPE indicado.":""; });
  const extra=dows.slice(days.length);
  const cardioBase=pf.cardio==="nao"?0:Math.max(G.cardio,G2?Math.min(G2.cardio,2):0); const cardioN=Math.max(0,cardioBase-aerN);

  const cardio={n:cardioN,mods:(pf.cardioMods&&pf.cardioMods.length?pf.cardioMods:["Bike"]),dias:extra,
    z2min:pf.objetivo==="saude"||pf.objetivo==="emagrecimento"?"30–45":"20–30",hiit:(["saude","misto","emagrecimento"].includes(pf.objetivo)||pf.secundario==="saude")&&weeksIn(pf)>=4};

  for(let guard=0;guard<40;guard++){ const vv=weeklyVolume(days).v; const over=MUSCLES.filter(m=>!prio.has(m)&&vv[m]>target[1]+1); if(!over.length) break;
    let cut=false; for(const m of over){ for(const d of days.slice().reverse()){ const e=d.ex.slice().reverse().find(x=>x.k!=="C"&&x.m===m&&x.sets>2); if(e){ e.sets--; e.rpe=e.rpe.slice(0,e.sets); cut=true; break; } } }
    if(!cut) break; }
  const vol=weeklyVolume(days);
  const notes=[];
  if(want>lift) notes.push(`Você marcou ${want} dias. Para quem está começando, ${lift} dias de musculação dão o melhor resultado; ${extra.length?`os dias extras (${extra.map(d=>DOWN[d]).join(", ")}) ficam para cardio`:"os outros dias ficam livres ou para cardio"}.`);
  if(!sp.dias.includes(lift)) notes.push(`A divisão "${sp.nome}" foi pensada para ${sp.dias.join(" ou ")} dias; com ${lift} dias alguns grupos treinam com frequência desigual. Veja o volume semanal na aba Perfil.`);
  espNotes.forEach(n=>notes.push(n)); if(arr.pen>=2) notes.push("Com os dias de musculação e de esporte que você marcou, algum treino de pernas ficou perto de uma atividade forte. Se puder, deixe 1 dia entre eles.");
  if(tecnica(pf)) notes.push("Semanas 1 e 2: fase de técnica. Use cargas em que sobram 3–4 repetições (RPE 6–7) e foque em aprender o movimento.");
  return {sk,split:sp.nome,por:sp.por,goal:G.nome,goal2:G2?G2.nome:null,days,cardio,notes,lift,vol,target};
}

/* ---------- outras atividades da rotina (esportes) ----------

const SPORTS={

  "Natação":{leg:0.3,up:1,aer:true},"Crossfit / funcional":{leg:1,up:1,aer:true},"Tênis / beach tennis / padel":{leg:0.6,up:0.6,aer:true},

  "Escalada":{leg:0.2,up:1,aer:false},"Dança":{leg:0.6,up:0.2,aer:true},"Yoga / pilates / mobilidade":{leg:0,up:0,aer:false},"Outro":{leg:0.5,up:0.5,aer:true}

function sportLoad(pf,dow){ let leg=0,up=0; sportsOn(pf,dow).forEach(s=>{ const S=SPORTS[s.mod]||SPORTS.Outro, k=INT[s.int]||0.6; leg=Math.max(leg,S.leg*k); up=Math.max(up,S.up*k); }); return {leg,up}; }
function regionOf(day){ const n=day.ex.length||1; const L=day.ex.filter(e=>LOWER.has(e.p)).length/n, U=day.ex.filter(e=>UPPER.has(e.p)).length/n; return {L,U}; }
/* escolhe a ordem dos treinos nos dias de musculação que menos atrapalha as outras atividades */
function arrangeDays(days,dows,pf){
  if(!(pf.esportes||[]).length||days.length<2) return {order:days.map((_,i)=>i),pen:0};
  const R=days.map(regionOf), nx=d=>(d+1)%7, pv=d=>(d+6)%7;
  const cost=ord=>{ let c=0; ord.forEach((ti,i)=>{ const d=dows[i]; if(d==null) return; const r=R[ti], same=sportLoad(pf,d), next=sportLoad(pf,nx(d)), prev=sportLoad(pf,pv(d));
      c+=r.L*same.leg*(same.leg>=0.6?4:1)+r.U*same.up*0.4+r.L*next.leg*(next.leg>=0.6?2.5:0.5)+r.L*prev.leg*1;
      const j=dows.indexOf(nx(d)); if(j>=0&&j<ord.length){ const r2=R[ord[j]]; if(r.L>0.6&&r2.L>0.6) c+=1.5; } });
    return c; };
  const idx=days.map((_,i)=>i); let best=idx.slice(), bc=cost(idx);
  const perm=(a,k)=>{ if(k===a.length){ const c=cost(a); if(c<bc-1e-9){ bc=c; best=a.slice(); } return; } for(let i=k;i<a.length;i++){ [a[k],a[i]]=[a[i],a[k]]; perm(a,k+1); [a[k],a[i]]=[a[i],a[k]]; } };
  if(days.length<=6) perm(idx.slice(),0);

/* ---------- histórico, e1RM e sugestão de carga ---------- */
const e1rm=(kg,reps,rpe)=>kg*(1+(reps+(rpe>=5&&rpe<=10?10-rpe:2))/30);
const sessE1=sets=>Math.max(0,...sets.map(s=>e1rm(s.kg||0,s.reps||0,s.rpe)));
function historyFor(name){ return state.sessions.filter(s=>s.ex&&s.ex[name]).sort((a,b)=>b.ts-a.ts).map(s=>({date:s.date,leve:s.leve,sets:s.ex[name]})); }
function incOf(ex,name){ if(/halter/i.test(name)) return 2; if(ex.k==="C") return ex.low?5:2.5; return /cabo|máquina|cadeira|mesa|peck|leg press|flexora|extensora|abdução/i.test(name)?2.5:1; }
const roundTo=(v,s)=>Math.round(v/s)*s;
function chosen(ex){ const i=state.prefs.swap[ex.id]||0; return ex.opts[i]||ex.opts[0]; }
function suggest(ex){
  const name=chosen(ex), inc=incOf(ex,name); const h=historyFor(name).filter(x=>!x.leve);
  if(!h.length) return {kg:"",reps:ex.hi,cls:"",html:`<span class="tag t-new">★ PRIMEIRA VEZ</span> <strong>Descubra sua carga.</strong> Escolha uma carga em que você faria ${ex.hi} reps sobrando 3 (RPE 7). Anote o que fizer: a ficha calcula a próxima.`};
  if(tecnica(state.pf)) { const L=Math.max(...h[0].sets.map(s=>s.kg||0)); return {kg:L,reps:ex.hi,cls:"",html:`<span class="tag t-keep">= MANTER</span> <strong>Fase de técnica: mantenha ${fmt(L)} kg.</strong> Foque em fazer todas as reps bem feitas.`}; }
  const last=h[0].sets, L=Math.max(...last.map(s=>s.kg||0)); const work=last.filter(s=>(s.kg||0)===L);
  const allTop=work.length>=Math.min(ex.sets,last.length)&&work.every(s=>s.reps>=ex.hi); const lr=work[work.length-1]?.rpe; const tgt=ex.rpe[ex.rpe.length-1];
  if(allTop&&!(lr>tgt+0.5)){ const pct=ex.k==="C"?(ex.low?0.05:0.025):0.05; let nk=roundTo(L*(1+pct),inc); if(nk<=L) nk=L+inc;
    return {kg:nk,reps:ex.lo,cls:"up",html:`<span class="tag t-up">⬆ SUBIR</span> <strong>Suba para ${fmt(nk)} kg</strong> (+${fmt(Math.round((nk/L-1)*1000)/10)}%). Você bateu ${ex.hi} reps em todas as séries. Recomece em ${ex.lo} reps.`}; }
  const below=s=>s.sets.filter(x=>(x.kg||0)===Math.max(...s.sets.map(y=>y.kg||0))).some(x=>x.reps<ex.lo);
  if(h.length>=2&&below(h[0])&&below(h[1])){ const nk=Math.max(0,roundTo(L*0.9,inc)); return {kg:nk,reps:ex.hi,cls:"stall",html:`<span class="tag t-down">⬇ REDUZIR</span> <strong>Reduza para ${fmt(nk)} kg</strong> (−10%). Duas sessões abaixo de ${ex.lo} reps: recomece mais leve e suba de novo.`}; }
  const minR=Math.min(...work.map(s=>s.reps)); const tr=Math.min(ex.hi,minR+1);
  return {kg:L,reps:tr,cls:"",html:`<span class="tag t-keep">= MANTER</span> <strong>Mantenha ${fmt(L)} kg e busque +1 rep</strong> por série (meta: ${tr}). Quando fizer ${ex.hi} em todas, a carga sobe.`};
}
function readiness(id){
  const d=state.plan&&state.plan.days.find(x=>x.key===state.current); const ex=d&&d.ex.find(e=>e.id===id); const box=document.getElementById("rd-"+id); if(!ex||!box) return;
  const g=f=>{ const el=document.getElementById(`${id}-${f}-0`); return el?num(el.value||el.placeholder):NaN; };
  const rpe=num(($(`#${id}-p-0`)||{}).value), kg=g("kg"), reps=g("r");
  if(!(rpe>=5&&rpe<=10)||!(kg>=0)||!(reps>0)){ box.hidden=true; return; }
  const t=ex.rpe[0], inc=incOf(ex,chosen(ex)); let act,why,cls="";
  const target=kg>0?e1rm(kg,reps,rpe)/(1+(reps+10-t)/30):0; let nk=kg>0?roundTo(target,inc):0; const pr=kg>0?Math.round((nk/kg-1)*1000)/10:0;
  if(rpe>=t+1){ cls="bad"; why=`Série 1 com RPE ${fmt(rpe)}; o alvo era ${fmt(t)}.`; act=rpe-t>=2&&nk<kg?`Considere reduzir ${fmt(Math.abs(pr))}% → ${fmt(nk)} kg nas próximas séries.`:`Mantenha ${fmt(kg)} kg e faça 1 rep a menos nas próximas séries.`; }
  else if(rpe<=t-1){ cls="good"; why=`Série 1 com RPE ${fmt(rpe)}; o alvo era ${fmt(t)}.`; act=t-rpe>=2&&nk>kg&&nk<=target*1.05?`Considere aumentar +${fmt(pr)}% → ${fmt(nk)} kg nas próximas séries.`:`Mantenha ${fmt(kg)} kg e faça +${t-rpe>=2?2:"1–2"} reps nas próximas séries.`; }
  else { act="Mantenha a carga e as reps. Siga o plano."; why=`Série 1 no alvo (RPE ${fmt(rpe)}).`; }
  box.className="rd "+cls; box.innerHTML=`<b>${act}</b><br><small>${why}</small>`; box.hidden=false;

function splitHint(){ const box=$("#splitHint"); if(!box) return;

  if(tmp.dias.length<2){ box.textContent="Escolha pelo menos 2 dias para ver a divisão."; return; }
  const pl=buildPlan(tmp), sp=SPLITS[pl.sk], fr=pl.vol.f, big=["peito","costas","pernas","posterior","ombros"];
  const fq=big.map(m=>`${m} ${fr[m]}×`).join(" · "), low=big.filter(m=>fr[m]<2);

async function saveProfile(){

  try{ await store.put("perfil",pf); setStatus(old?"Plano atualizado.":"Plano criado. Bom treino!"); }catch(e){ setStatus("Não consegui salvar o perfil. Tente de novo."); }

function defaultTab(){ const t=new Date().getDay(); const d=state.plan&&state.plan.days.find(x=>x.dow.includes(t)); return d?d.key:(state.plan&&state.plan.cardio.dias.includes(t)?"cardio":(state.plan?state.plan.days[0].key:"perfil")); }

/* ---------- treino do dia ---------- */

  return `Faça <b>${n} séries</b> de <b>${ex.lo} a ${ex.hi} repetições</b>. Pare cada série quando sentir que sobrariam <b>${sobra===1?"1 repetição":sobra+" repetições"}</b>. Descanse <b>${rest}</b>.`; }
/* cartão de exemplo explicando cada parte da ficha (aparece até a pessoa fechar) */

const wearName=w=>({whoop:"Whoop",apple:"Apple Watch",garmin:"Garmin"}[w]||"relógio");
/* campos de esforço por aparelho: Whoop = Strain (0–21); Garmin = Training Effect aeróbico (0–5) + carga de treino; outros = esforço 1–10 */
function effortFields(prefix,wear){
  if(wear==="whoop") return `<label>Strain (0–21)<input inputmode="decimal" id="${prefix}-strain" placeholder="12"></label>`;
  if(wear==="garmin") return `<label>Training Effect<input inputmode="decimal" id="${prefix}-te" placeholder="3,0"></label><label>Carga de treino<input inputmode="numeric" id="${prefix}-load" placeholder="80"></label>`;

function readEffort(prefix,o){ [["strain",0,21],["te",0,5],["load",0,1000]].forEach(([k,a,b])=>{ const el=$(`#${prefix}-${k}`); const v=el?num(el.value):NaN; if(v>=a&&v<=b) o[k]=v; }); return o; }
function setDone(id,i){ const h=document.getElementById(`${id}-d-${i}`); return !!(h&&h.value==="1"); }
function syncDone(){ $$(".card.ex").forEach(c=>{ const id=c.dataset.ex, n=Number(c.dataset.sets); let k=0, parts=[];
  c.querySelectorAll(".okb").forEach(b=>{ const i=b.dataset.i, d=setDone(id,i); b.setAttribute("aria-pressed",String(d)); ["kg","r","p"].forEach(f=>{ const el=document.getElementById(`${id}-${f}-${i}`); if(el) el.classList.toggle("dn",d); });
    if(d){ k++; parts.push(`${$(`#${id}-kg-${i}`).value}×${$(`#${id}-r-${i}`).value}`); } });
  const all=k===n; c.classList.toggle("done",all); if(!all) c.classList.remove("open"); c.querySelector(".donesum").textContent=parts.join("  "); }); updateProgress(); }
function updateProgress(){ const bar=$("#progBar"), txt=$("#progTxt"); if(!bar) return; const cs=$$(".card.ex"); const done=cs.filter(c=>c.classList.contains("done")).length;
  bar.style.width=(cs.length?100*done/cs.length:0)+"%"; txt.textContent=done===cs.length&&cs.length?"Treino completo: toque em Salvar":`${done} de ${cs.length} exercícios`; }
let actx=null;
function okSet(b){ const c=b.closest(".card"), id=c.dataset.ex, i=b.dataset.i, hid=document.getElementById(`${id}-d-${i}`);
  if(hid.value==="1"){ hid.value=""; syncDone(); scheduleDraft(); return; }
  const kg=$(`#${id}-kg-${i}`), r=$(`#${id}-r-${i}`);
  if(!kg.value){ if(isFinite(num(kg.placeholder))) kg.value=kg.placeholder; else { kg.focus(); setStatus("Digite a carga desta série antes do ✓."); return; } }
  if(!r.value){ if(isFinite(num(r.placeholder))) r.value=r.placeholder; else { r.focus(); return; } }
  hid.value="1"; try{ if(!actx){ const A=window.AudioContext||window.webkitAudioContext; if(A) actx=new A(); } if(actx&&actx.state==="suspended") actx.resume(); }catch(e){}
  const d=state.plan.days.find(x=>x.key===state.current), ex=d.ex.find(e=>e.id===id), n=Number(c.dataset.sets);
  const nm=c.querySelector(".exname").textContent; const lastOf=[...Array(n).keys()].every(j=>setDone(id,j));

/* ---------- cronômetro de descanso ---------- */
const rest={end:0,timer:null,lock:null,fired:false};
const fmtT=s=>Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
function startRest(sec,lbl){ rest.end=Date.now()+sec*1000; rest.fired=false; $("#restLbl").textContent=lbl; $("#rest").hidden=false; $("#rest").classList.remove("over");
  clearInterval(rest.timer); rest.timer=setInterval(tickRest,250); tickRest(); try{ if(navigator.wakeLock&&!rest.lock) navigator.wakeLock.request("screen").then(l=>{rest.lock=l;}).catch(()=>{}); }catch(e){} }
function beep(){ try{ if(!actx) return; [0,0.25].forEach(t=>{ const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=880; o.connect(g); g.connect(actx.destination);
  g.gain.setValueAtTime(0.0001,actx.currentTime+t); g.gain.exponentialRampToValueAtTime(0.3,actx.currentTime+t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+t+0.18); o.start(actx.currentTime+t); o.stop(actx.currentTime+t+0.2); }); }catch(e){} }
function tickRest(){ const left=Math.ceil((rest.end-Date.now())/1000); if(left>0){ $("#restT").textContent=fmtT(left); return; }
  $("#restT").textContent="0:00"; $("#rest").classList.add("over");
  if(!rest.fired){ rest.fired=true; $("#restLbl").textContent="Descanso acabou · próxima série"; beep(); try{ navigator.vibrate&&navigator.vibrate([200,100,200]); }catch(e){} }
  if(Date.now()-rest.end>30000) closeRest(); }
function closeRest(){ clearInterval(rest.timer); $("#rest").hidden=true; try{ rest.lock&&rest.lock.release(); }catch(e){} rest.lock=null; }

function zoneFb(){ const z=[1,2,3,4,5].map(i=>num(($("#cardio-z"+i)||{}).value)||0), tot=z.reduce((a,b)=>a+b,0), box=$("#cfb"); if(!box) return; if(!tot){ box.hidden=true; return; }

/* ---------- salvar ---------- */
async function saveDay(){
  const now=new Date(), iso=todayISO();
  if(state.current==="cardio"){ const min=num($("#cardio-min").value); const z=[1,2,3,4,5].map(i=>num($("#cardio-z"+i).value)||0); const tot=z.reduce((a,b)=>a+b,0);
    if(!(min>0)&&!tot){ setStatus("Informe os minutos do cardio."); return; }
    const c={tipo:{z2:"Zona 2","4x4":"4×4",livre:"Outro"}[chipVal("ctipo")]||"Zona 2",mod:chipVal("cmod"),min:min>0?min:tot}; const fc=num($("#cardio-fc").value); if(fc>0)c.fc=fc; readEffort("cardio",c); if(tot){ c.zonas=z; c.trimp=Math.round(z.reduce((a,v,i)=>a+v*(i+1),0)); }
    const s={type:"session",date:iso,day:"cardio",cardio:c,ts:now.getTime()}; return persist(s,"cardio-"); }
  const d=state.plan.days.find(x=>x.key===state.current); const ex={}; let count=0;
  d.ex.forEach(e=>{ const name=chosen(e), sg=suggest(e), sets=[];
    for(let i=0;i<nSets(e);i++){ const k=$(`#${e.id}-kg-${i}`).value.trim(), r=$(`#${e.id}-r-${i}`).value.trim(); if(!k&&!r&&!setDone(e.id,i)) continue;
      const kg=k?num(k):num(sg.kg), reps=Math.round(r?num(r):num(sg.reps)), rpe=num($(`#${e.id}-p-${i}`).value);
      if(isFinite(kg)&&reps>0){ const s={kg,reps}; if(rpe>=5&&rpe<=10) s.rpe=rpe; sets.push(s); } }
    if(sets.length){ ex[name]=sets; count+=sets.length; } });
  if(!count){ setStatus("Preencha ao menos uma série antes de salvar."); return; }
  const s={type:"session",date:iso,day:d.key,label:d.n,ex,ts:now.getTime()}; if(state.leve) s.leve=true;
  const w={fc:num($(`#${d.key}-w-fc`).value),min:num($(`#${d.key}-w-min`).value)}; Object.keys(w).forEach(k=>{ if(!(w[k]>=0)) delete w[k]; }); readEffort(d.key+"-w",w); if(Object.keys(w).length) s.watch=w;
  return persist(s,d.key+"x",d.key+"-w"); }
async function persist(s,...prefixes){ const btn=$("#saveBtn"); btn.disabled=true;
  try{ state.sessions.push(s); await store.put("s_"+s.ts,s); setStatus(s.cardio?`Cardio salvo em ${dstr(s.date)}.`:`Treino salvo em ${dstr(s.date)}. No próximo, a ficha já mostra as cargas novas.`); for(const p of prefixes) await clearDayDraft(p); state.leve=false; render(); window.scrollTo({top:0}); }
  catch(e){ state.sessions.pop(); setStatus("Não foi possível salvar. Verifique a conexão e tente de novo."); }
  btn.disabled=false; }

/* ---------- histórico, gráficos e recuperação ---------- */
function spark(points,unit){ if(points.length<2) return ""; const W=320,H=90,P=34; const ys=points.map(p=>p.v); let mn=Math.min(...ys), mx=Math.max(...ys); if(mn===mx){mn-=1;mx+=1;}
  const x=i=>P+(W-P-8)*(i/(points.length-1)), y=v=>8+(H-26)*(1-(v-mn)/(mx-mn)); const dd=points.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução">
    <line x1="${P}" y1="${y(mx)}" x2="${W-8}" y2="${y(mx)}" stroke="var(--line)"/><line x1="${P}" y1="${y(mn)}" x2="${W-8}" y2="${y(mn)}" stroke="var(--line)"/>
    <text x="${P-4}" y="${y(mx)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(Math.round(mx*10)/10)}</text><text x="${P-4}" y="${y(mn)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${fmt(Math.round(mn*10)/10)}</text>
    <path d="${dd}" fill="none" stroke="var(--accent)" stroke-width="2"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="3" fill="var(--accent)"/>`).join("")}
    <text x="${P}" y="${H-4}" font-size="10" fill="var(--muted)">${dstr(points[0].d)}</text><text x="${W-8}" y="${H-4}" text-anchor="end" font-size="10" fill="var(--muted)">${dstr(points[points.length-1].d)} · ${fmt(Math.round(points[points.length-1].v*10)/10)} ${unit}</text></svg>`; }
function recSignals(cks,wear){ const a=cks.slice().sort((x,y)=>x.week<y.week?-1:1); if(!a.length) return {html:"",n:0}; const cur=a[a.length-1], prev=a.slice(-5,-1);
  const base=k=>{ const v=prev.map(c=>c[k]).filter(x=>x>0); return v.length>=2?v.reduce((t,b)=>t+b,0)/v.length:null; }; const out=[]; let n=0;
  if(cur.sono&&cur.sono<6.5){ n++; out.push(`<div class="al">Sono ${fmt(cur.sono)} h/noite: abaixo de 6,5 h.</div>`); }
  if(cur.rec!=null){ if(cur.rec<34){ n++; out.push(`<div class="al">Recovery médio ${fmt(cur.rec)}% (vermelho no Whoop): semana de pouca recuperação.</div>`); } else if(cur.rec<50) out.push(`<p class="note">Recovery médio ${fmt(cur.rec)}% (amarelo): atenção ao sono e ao volume.</p>`); else out.push(`<p class="note">Recovery médio ${fmt(cur.rec)}%: bom.</p>`); }
  if(cur.prt!=null){ if(cur.prt<25){ n++; out.push(`<div class="al">Prontidão de treino média ${fmt(cur.prt)} (baixa no Garmin): recuperação incompleta.</div>`); } else if(cur.prt<50) out.push(`<p class="note">Prontidão média ${fmt(cur.prt)} (moderada): atenção ao sono e ao volume.</p>`); else out.push(`<p class="note">Prontidão média ${fmt(cur.prt)}: boa.</p>`); }
  const bf=base("fcr"); if(cur.fcr&&bf){ const d=cur.fcr-bf; if(d>=5){ n++; out.push(`<div class="al">FC de repouso ${fmt(cur.fcr)} bpm, ${fmt(Math.round(d))} acima da sua média.</div>`);} }
  const bv=base("vfc"); if(cur.vfc&&bv){ const p=(cur.vfc/bv-1)*100; if(p<=-10){ n++; out.push(`<div class="al">VFC ${fmt(cur.vfc)} ms, ${fmt(Math.round(-p))}% abaixo da sua média.</div>`);} else out.push(`<p class="note">VFC ${fmt(cur.vfc)} ms vs média ${fmt(Math.round(bv))}: normal.</p>`); }
  if(n>=2) out.push(`<div class="al"><b>${n} sinais de cansaço nesta semana.</b> Considere fazer a próxima semana leve (opção "Treino leve").</div>`);
  return {html:out.join(""),n}; }
function renderHist(){

    <p><b>Exemplo:</b> supino 40 kg: 8, 8, 7 → 9, 9, 8 → … → 12, 12, 12 → próximo treino 42 kg × 8.</p>
    <p>Se em 2 treinos seguidos você ficar abaixo do mínimo, a ficha manda baixar 10% e subir de novo. Use <b>a mesma carga em todas as séries de trabalho</b>, senão a ficha não consegue comparar.</p>`)}
  ${sec("4. Trocar exercício",`<p>O botão <b>⇄ Trocar</b> mostra todas as variações daquele movimento que servem para o seu local de treino. Troque quando: o aparelho estiver ocupado, doer, você não gostar ou a carga travar por 3 treinos. Cada variação guarda o próprio histórico. Variar de vez em quando ajuda, mas trocar todo treino atrapalha medir a evolução: o ideal é manter por 4–8 semanas.</p>`)}
  ${sec("5. Divisões de treino: qual escolher",`<p>Divisão é como os músculos são distribuídos nos dias. O que mais pesa no resultado é o <b>total de séries por músculo na semana</b> e treinar perto da falha; com o mesmo total, treinar o músculo 1× ou 2× por semana dá resultados parecidos. Na prática, <b>2× por semana</b> costuma render mais, porque as séries ficam distribuídas e você chega menos cansado nas últimas.</p>
    <div style="overflow-x:auto"><table class="gt"><tbody>${splitRows}</tbody></table></div>
    <p><b>Resumo:</b> 2–3 dias → corpo inteiro. 4 dias → superior/inferior. 5–6 dias → superior/inferior + corpo inteiro ou empurrar/puxar/pernas. "Peito e tríceps / costas e bíceps" funciona, mas só dá 1× por semana com 3 dias. Para mudar, vá em Perfil → Editar.</p>`)}
  ${sec("5b. Musculação junto com outro esporte",`<p>Se você também faz jiu-jitsu, corrida, futebol ou outra atividade, cadastre no Perfil (dias e intensidade). A ficha segue estas regras:</p><ul>
    <li><b>Treino de pernas não fica no mesmo dia nem na véspera de atividade forte de pernas</b> (futebol, corrida, luta). Pernas cansadas rendem menos nos dois.</li>
    <li><b>Treino de tronco no dia de atividade forte é ok.</b> Perna no dia de atividade leve também.</li>
    <li>No mesmo dia, <b>faça a musculação antes</b> e, se der, deixe algumas horas entre os dois.</li>
    <li>Atividades que cansam muito as pernas tiram 1 série dos acessórios de perna; lutas e crossfit tiram 1 série de bíceps e tríceps.</li>
    <li>Atividades moderadas ou fortes <b>contam como cardio</b>: a ficha desconta do cardio recomendado.</li></ul>`)}
  ${sec("6. Volume: quantas séries por semana",`<p>Para ganhar músculo, os estudos mostram que mais séries por semana dão mais resultado até certo ponto: <b>10–20 séries por músculo por semana</b> para quem já treina, e <b>6–12</b> para iniciante. Para força e saúde, menos já resolve. A aba Perfil mostra quantas séries o seu plano dá para cada músculo. Para dar mais séries a um músculo, marque-o como <b>prioridade</b> no Perfil.</p>`)}
  ${sec("7. Descanso entre séries",`<p>Exercícios principais (agachamento, supino, remada, terra): <b>2–3 min</b>. Acessórios: <b>1–1,5 min</b>. Descansar pouco demais nos principais diminui o número de reps e o resultado. O cronômetro da ficha já usa esses tempos.</p>`)}
  ${sec("8. Treino leve e cansaço",`<p>Dormiu mal, está doente ou muito cansado? Em Opções do dia, marque <b>Treino leve</b>: metade das séries, sem forçar. A cada 6–10 semanas, ou quando a ficha mostrar 2 sinais de cansaço (cargas caindo, sono curto, recuperação baixa no relógio), faça uma semana inteira leve. Ela não conta para a progressão.</p>`)}
  ${sec("9. Cardio",`<p><b>Zona 2</b>: ritmo em que dá para conversar em frases curtas (60–70% da FC máxima). Melhora a saúde do coração e a recuperação. <b>4×4</b>: 4 min forte (só palavras soltas) + 3 min leve, 4 vezes. Melhora rápido o condicionamento (VO₂máx). A OMS recomenda <b>150–300 min por semana</b> de atividade moderada para saúde. Se for fazer cardio no mesmo dia das pernas, prefira bike e faça depois da musculação.</p>`)}
  ${sec("10. Relógio: o que anotar",wearTxt+`<p>Os números do relógio são complemento: um dia ruim isolado não quer dizer nada; a ficha olha a média da semana e compara com as suas 4 semanas anteriores.</p>`)}
  ${sec("11. Análise semanal",`<p>Uma vez por semana (domingo ou segunda), abra o <b>Histórico</b> e toque em <b>Analisar meu treino</b>. O Claude lê seus registros e diz o que está evoluindo, o que travou, o que fazer no próximo treino e se é hora de semana leve. A análise fica guardada e você vê as das semanas anteriores.</p>
    <p><b>Quer receber automático?</b> Peça ao seu Claude, numa conversa: <i>"Crie uma tarefa agendada todo domingo às 20h que leia os dados da minha Ficha de Treino [cole o link da ficha] e me mande a análise semanal."</i> Isso depende do seu plano do Claude; se não der, use o botão.</p>`)}
  ${sec("12. Alimentação e sono",`<p><b>Proteína:</b> ${prot}, dividida em 3–4 refeições. É o que mais ajuda o treino a virar músculo. <b>Sono:</b> 7 h ou mais por noite; abaixo de 6,5 h a recuperação e o desempenho caem.</p>`)}
  ${sec("Base científica",`<ul class="refs">
    <li>Frequência: Schoenfeld, Ogborn & Krieger, 2016 (Sports Medicine) e Schoenfeld, Grgic & Krieger, 2019 (Journal of Sports Sciences): com volume igual, frequência importa pouco; 2×/semana é uma boa referência.</li>
    <li>Volume: Schoenfeld, Ogborn & Krieger, 2017 (Journal of Sports Sciences) e Pelland et al., 2025 (Sports Medicine): mais séries semanais, mais ganho, com retornos menores no alto volume.</li>
    <li>Proximidade da falha: Refalo et al., 2023 e Robinson et al., 2024 (Sports Medicine): parar a 1–3 reps da falha rende quase o mesmo que a falha.</li>
    <li>Faixa de repetições: Schoenfeld et al., 2017 (JSCR): de ~6 a 30 reps hipertrofia parecida, se perto da falha; força responde melhor a cargas altas.</li>
    <li>Escala RPE por repetições na reserva: Zourdos et al., 2016 (JSCR); erro típico de ~1 rep: Halperin et al., 2022.</li>
    <li>Variação de exercícios: Kassiano et al., 2022 (JSCR). Descanso: Schoenfeld et al., 2016 (JSCR).</li>
    <li>Treino concorrente (cardio + musculação): Wilson et al., 2012 (JSCR). Intervalado 4×4: Helgerud et al., 2007 (MSSE).</li>
    <li>Proteína: Morton et al., 2018 (British Journal of Sports Medicine). Atividade física: OMS, 2020.</li></ul>
    <p class="note">Ficha educacional: não substitui avaliação médica nem acompanhamento de um profissional de educação física.</p>`)}
  </div>`;
  if($("#backOnb")) $("#backOnb").onclick=()=>{ state.current="onb"; render(); window.scrollTo({top:0}); };
}

/* ---------- perfil ---------- */
let prioSet=new Set();
function renderPerfil(){ const p=state.pf, pl=state.plan, G=GOALS[p.objetivo];
  const ex=pl.days.map((d,i)=>`<li><b>${String.fromCharCode(65+i)} · ${esc(d.n)}</b>${d.dow.length?" ("+DOWN[d.dow[0]]+")":""}${d.sport&&d.sport.length?" · com "+esc(d.sport.join(", ")):""}: ${d.ex.map(e=>esc(chosen(e))).join(", ")}</li>`).join("");
  $("#day").innerHTML=`<div class="col"><div class="dayhead"><h2>${esc(p.nome||"Seu perfil")}</h2></div>
    ${p.saudeQ==="sim"?'<div class="banner">Você marcou um sinal de alerta de saúde: passe por um médico antes de começar e leve este plano para ele ver.</div>':""}
    <article class="card"><div class="exname">Seu plano</div>
      <p class="exnote"><b>Objetivo:</b> ${esc(pl.goal)}${pl.goal2?" + "+esc(pl.goal2):""} · <b>Divisão:</b> ${esc(pl.split)} (${pl.lift} dias) · <b>Tempo:</b> ${p.tempo} min · <b>Cardio:</b> ${pl.cardio.n}×/sem</p>
      <p class="exnote">${esc(pl.por)}</p>${(p.esportes||[]).length?`<p class="exnote"><b>Outras atividades:</b> ${esc(sportSummary(p))}.</p>`:""}
      <p class="exnote"><b>Principais:</b> ${G.C.sets} séries de ${G.C.lo}–${G.C.hi} reps · <b>Acessórios:</b> ${G.A.sets} séries de ${G.A.lo}–${G.A.hi} reps${beginner(p)?" · RPE máximo 8 (iniciante: sobra sempre pelo menos 2 reps)":""}.</p>
      <p class="exnote"><b>Como progride:</b> quando você faz o topo da faixa de reps em todas as séries, a carga sobe (+2,5% a 5%). Se não, mantenha a carga e busque +1 rep.</p>
      <ul class="plist">${ex}</ul>${pl.notes.map(n=>`<div class="banner dl">${esc(n)}</div>`).join("")}</article>
    <article class="card"><div class="exname">Volume semanal por músculo</div>
      <p class="exnote">Séries de trabalho por semana (exercícios que ajudam contam meia série). Meta para o seu objetivo e experiência: <b>${pl.target[0]}–${pl.target[1]}</b> séries.</p>
      <table class="gt"><tbody>${(prioSet=new Set(p.prioridades||[]),"")}${MUSCLES.map(m=>{ const v=Math.round(pl.vol.v[m]*10)/10, f=pl.vol.f[m]; const st=v<pl.target[0]?["Pouco","bad"]:v>pl.target[1]?[prioSet.has(m)?"Acima (prioridade)":"Acima","good"]:["Na meta","good"];
        return `<tr><td>${m[0].toUpperCase()+m.slice(1)}</td><td class="tr">${fmt(v)} séries · ${f}×/sem</td><td class="${st[1]}">${st[0]}</td></tr>`; }).join("")}</tbody></table>
      <p class="note">"Pouco": marque o músculo como prioridade ou aumente o tempo por treino (panturrilha e abdômen com pouco volume é normal se não forem prioridade). "Acima": braços e ombros recebem séries indiretas dos exercícios de peito, costas e desenvolvimento; não é problema.</p></article>
    <div class="askrow"><button class="ckbtn" id="editPf" type="button">Editar objetivo e rotina</button></div>
    <details><summary>Backup dos dados</summary><p class="note">Copie o texto abaixo e guarde (ex.: nas Notas). Para restaurar, cole e toque em Importar.</p>
      <textarea id="bk" rows="5" style="width:100%;box-sizing:border-box;font:12px var(--mono);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px">${esc(JSON.stringify({sessions:state.sessions,checkins:state.checkins,pf:state.pf,prefs:state.prefs}))}</textarea>
      <div class="askrow" style="margin-top:8px"><button class="ghost" id="bkImp" type="button">Importar</button></div></details></div>`;
  $("#editPf").onclick=()=>{ state.editing=true; render(); window.scrollTo({top:0}); };
  $("#bkImp").onclick=async()=>{ let o; try{ o=JSON.parse($("#bk").value); }catch(e){ setStatus("Texto de backup inválido."); return; }
    const ids=new Set(state.sessions.map(s=>s.ts)); const add=(o.sessions||[]).filter(s=>s&&s.type==="session"&&!ids.has(s.ts));
    try{ for(const s of add){ await store.put("s_"+s.ts,s); state.sessions.push(s); } if(o.pf&&!state.pf) { state.pf=o.pf; await store.put("perfil",o.pf); } setStatus(`${add.length} treinos importados.`); }catch(e){ setStatus("Falha ao importar."); } };
}

/* ---------- análise pelo Claude ---------- */
let sampleFn=null, askCtl=null;
function planSummary(){ return state.plan.days.map((d,i)=>`${String.fromCharCode(65+i)} ${d.n}${d.dow.length?" ("+DOWN[d.dow[0]]+")":""}: `+d.ex.map(e=>`${chosen(e)} ${e.sets}×${e.lo}–${e.hi} RPE ${e.rpe.join("/")}`).join("; ")).join("\n")+`\nCardio: ${state.plan.cardio.n}×/sem, zona 2 ${state.plan.cardio.z2min} min${state.plan.cardio.hiit?" + 4×4 1×/sem":""}.`; }
function analysisPrompt(){ const p=state.pf, since=new Date(Date.now()-28*864e5).toISOString().slice(0,10);
  const ss=state.sessions.filter(s=>s.date>=since).sort((a,b)=>a.ts-b.ts).map(s=>{ const o={data:s.date,treino:s.label||s.day}; if(s.leve)o.leve=true; if(s.ex)o.ex=s.ex; if(s.cardio)o.cardio=s.cardio; if(s.watch)o.relogio=s.watch; return o; });
  return `Você é um preparador físico analisando o treino de ${p.nome||"um aluno"}. Responda em português do Brasil, direto, específico, com números. Não invente dados; com poucos registros, diga isso.
PERFIL: ${p.idade||"?"} anos, ${p.peso||"?"} kg, ${p.altura||"?"} cm. Experiência: ${{nunca:"nunca treinou",ate6:"menos de 6 meses",["6a12"]:"6–12 meses",mais1:"mais de 1 ano"}[p.exp]}. Objetivo: ${GOALS[p.objetivo].nome}${p.secundario?" + "+GOALS[p.secundario].nome:""}. Dias: ${p.dias.map(d=>DOWN[d]).join(", ")}; ${p.tempo} min/treino; local: ${p.local}. Outras atividades: ${sportSummary(p)||p.esporte||"nenhuma"}. Dores: ${(p.dores||[]).join(", ")||"nenhuma"} ${p.doresTxt||""}. Prioridades: ${(p.prioridades||[]).join(", ")||"nenhuma"}. Trabalho: ${p.trabalho||"?"}; sono informado ${p.sono||"?"} h; estresse ${p.estresse}/5. Relógio: ${wearName(p.wear)}. Começou em ${p.inicio}; hoje ${todayISO()} (semana ${weeksIn(p)+1}).
PLANO:\n${planSummary()}
REGRAS: dupla progressão (sobe a carga quando faz o topo da faixa em todas as séries; +2,5% tronco, +5% pernas e acessórios). RPE = 10 − reps que sobravam; iniciantes subestimam ~1–2 reps. ${beginner(p)?"Iniciante: RPE máximo 8; nas 2 primeiras semanas a prioridade é técnica, não carga.":""} Força estimada: e1RM = kg × (1 + (reps + 10 − RPE)/30). Estagnação = 3 sessões sem subir carga nem reps. Carga variando entre séries de trabalho = aquecimento misturado: oriente usar a mesma carga. Semana leve se: 8+ semanas sem uma, ou 2+ sinais (cargas caindo em 3+ exercícios; RPE subindo com a mesma carga; sono < 6,5 h; ${p.wear==="whoop"?"Recovery médio < 34%; ":""}${p.wear==="garmin"?"Prontidão de treino média < 25; ":""}FC repouso ≥5 bpm acima da média; VFC ≥10% abaixo da média). Cardio: zona 2 bem feita = ≥70% do tempo em Z2; 4×4 = ~16 min em Z4–Z5. Combinação com esportes: perna no mesmo dia ou na véspera de atividade forte de pernas atrapalha; superior + atividade forte é ok; perna + atividade leve é ok. Atividades moderadas/fortes contam como cardio. Aderência: compare treinos feitos com ${state.plan.lift}/semana.
REGISTROS (4 semanas): ${JSON.stringify(ss)}
RECUPERAÇÃO SEMANAL (sono h, rec = Recovery % do Whoop, prt = Prontidão de treino do Garmin 0–100, fcr bpm, vfc ms): ${JSON.stringify(state.checkins.map(c=>({semana:c.week,sono:c.sono,rec:c.rec,prt:c.prt,fcr:c.fcr,vfc:c.vfc})))}
ESFORÇO DOS TREINOS: strain = Whoop (0–21); te = Training Effect aeróbico do Garmin (0–5; 2–2,9 manutenção, 3–3,9 melhora, 4+ muito alto); load = carga de treino Garmin (EPOC).
Responda SOMENTE com JSON: {"resumo":"2–3 frases","tabela":[{"exercicio":"…","trabalho":"última: 40 kg × 10, 10, 9 @8","tendencia":"↑|→|↓|novo","proxima":"o que fazer na próxima sessão"}],"alertas":["…"],"deload":{"recomendar":false,"motivo":"…"},"acoes":["…"]} — máx. 10 linhas, 3 alertas, 4 ações.`; }
async function runAnalysis(){ if(!sampleFn) return; const btn=$("#askBtn"), stop=$("#askStop"), out=$("#askOut"); askCtl=new AbortController(); btn.disabled=true; stop.hidden=false; stop.onclick=()=>askCtl.abort();
  const t0=Date.now(); out.innerHTML=`<p class="note" id="askWait">Analisando…</p>`; const tick=setInterval(()=>{ const w=$("#askWait"); if(w) w.textContent=`Analisando… ${Math.round((Date.now()-t0)/1000)} s`; },1000);
  try{ const r=await sampleFn.json(analysisPrompt(),{signal:askCtl.signal,cache:false}); if(!r||typeof r!=="object") throw {code:"invalid_json"};
    const doc=Object.assign({type:"analise",data:todayISO(),semana:weekStart(todayISO())},r); state.analysis=doc; state.anHist=[doc].concat((state.anHist||[]).filter(x=>x.semana!==doc.semana));
    try{ await store.put("analise",doc); await store.put("an_"+doc.semana,doc); }catch(e){} renderAsk(r); }
  catch(e){ out.innerHTML=`<p class="note">${({cancelled:"Análise interrompida.",rate_limited:"Limite de uso atingido. Tente mais tarde.",invalid_json:"Resposta em formato inesperado. Tente de novo."})[e&&e.code]||"Não foi possível analisar agora. Tente de novo."}</p>`; }
  finally{ clearInterval(tick); btn.disabled=false; stop.hidden=true; } }
function renderAsk(r){ const out=$("#askOut"); if(!out) return;
  out.innerHTML=`${r.resumo?`<p style="margin:0">${esc(r.resumo)}</p>`:""}${(r.tabela||[]).length?`<div style="overflow-x:auto"><table><thead><tr><th>Exercício</th><th>Trabalho</th><th></th><th>Próxima</th></tr></thead><tbody>${r.tabela.map(t=>`<tr><td>${esc(t.exercicio)}</td><td class="tr">${esc(t.trabalho)}</td><td>${esc(t.tendencia||"")}</td><td>${esc(t.proxima||"")}</td></tr>`).join("")}</tbody></table></div>`:""}
    ${(r.alertas||[]).map(a=>`<div class="al">${esc(a)}</div>`).join("")}${r.deload?`<p style="margin:0"><b>Semana leve:</b> ${r.deload.recomendar?"sim":"não"} · ${esc(r.deload.motivo||"")}</p>`:""}
    ${(r.acoes||[]).length?`<ul>${r.acoes.map(a=>`<li>${esc(a)}</li>`).join("")}</ul>`:""}<p class="note">Análise guardada no histórico desta semana.</p>`; }
function needsWeekly(){ const wk=weekStart(todayISO()); const recent=state.sessions.some(s=>s.date>=new Date(Date.now()-8*864e5).toISOString().slice(0,10));
  const done=(state.anHist||[]).some(a=>a.semana===wk); const dow=new Date().getDay(); return recent&&!done&&(dow===0||dow===1||!(state.anHist||[]).length); }

/* ---------- início ---------- */
$("#saveBtn").onclick=saveDay; $("#restX").onclick=closeRest; $("#restAdd").onclick=()=>{ rest.end=Math.max(rest.end,Date.now())+30000; rest.fired=false; $("#rest").classList.remove("over"); tickRest(); };
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"&&!$("#rest").hidden) tickRest(); });
(async()=>{
  draft.data=draftLocal(); setStatus("Carregando…");
  await store.init(); const o=await store.load();
  state.sessions=o.sessions||[]; state.checkins=o.checkins||[]; state.prefs=Object.assign({swap:{}},o.prefs||{}); state.pf=o.pf||null; state.analysis=o.analysis||null; state.anHist=(o.anHist||[]).sort((a,b)=>a.semana<b.semana?1:-1);
  if(state.pf) state.plan=buildPlan(state.pf);
  const dd=o.draft&&o.draft.type==="draft"&&o.draft.date===todayISO()?o.draft:null; draft.remote=!!dd; draft.bakR=!!(o.bak&&o.bak.date===todayISO()); draft.bak=draft.bakR?o.bak:null;
  draft.data=mergeD(dd,draft.data); draft.ready=true;
  state.current=draft.data&&state.plan&&(state.plan.days.some(d=>d.key===draft.data.day)||draft.data.day==="cardio")?draft.data.day:defaultTab();
  render(); setStatus(store.mode==="db"?(state.sessions.length?`${state.sessions.length} treinos registrados`:"Pronto"):"Registros salvos só neste aparelho");
  try{ if(window.claude&&claude.use) claude.use("sample").then(f=>{ sampleFn=f||null; if(sampleFn&&state.pf&&!state.editing&&state.current!=="perfil"&&state.current!=="guia"&&state.current!=="cardio") render(); }).catch(()=>{}); }catch(e){}
})();

</script>
