name: Testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build e testes do motor
        run: npm test
      - name: index.html e dist/ estão atualizados com o código
        run: git diff --exit-code -- index.html dist/
